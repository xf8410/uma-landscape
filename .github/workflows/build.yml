name: Build libhachimi_landscape.so

on:
  push:
    branches: [ main, 'workbench/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build plugin (arm64-v8a)
        run: |
          mkdir -p out
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++ \
            -shared -O2 -std=c++17 -fvisibility=hidden \
            plugin/hachimi_landscape.cpp \
            -o out/libhachimi_landscape.so \
            -llog -ldl

      - name: Build plugin (armeabi-v7a)
        run: |
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang++ \
            -shared -O2 -std=c++17 -fvisibility=hidden \
            plugin/hachimi_landscape.cpp \
            -o out/armeabi-v7a_libhachimi_landscape.so \
            -llog -ldl || echo "v7a optional"

      - name: Package
        run: |
          cd out
          echo "把 libhachimi_landscape.so 按小黑板(libhachimi_*.so)同样的方式装进游戏即可。" > INSTALL.txt
          zip -r ../uma-landscape-v0.2-plugin.zip .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: uma-landscape-v0.2-plugin
          path: uma-landscape-v0.2-plugin.zip
