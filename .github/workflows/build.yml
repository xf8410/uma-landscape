name: Build Uma Landscape (arm64 zygisk module)

on:
  push:
    branches: [ main, 'workbench/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build zip
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Fetch Dobby + zygisk headers
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby thirdparty/Dobby
          mkdir -p include
          curl -fsSL https://raw.githubusercontent.com/LSPosed/zygisk-module-sample/master/module/zygisk.hpp -o include/zygisk.hpp

      - name: Configure + build
        run: |
          cmake -S native -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DDOBBY_DIR=$PWD/thirdparty/Dobby \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package Magisk module
        run: |
          mkdir -p pkg/zygisk
          cp module.prop pkg/
          cp build/libuma_landscape.so pkg/zygisk/arm64-v8a.so
          cd pkg && zip -r ../uma-landscape-v0.1.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: uma-landscape-v0.1
          path: uma-landscape-v0.1.zip
